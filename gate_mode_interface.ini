# gates mode
# page 1
[logic]
    input1 = _GATE_MDE
    input2 = _PAGE1
    and    = _GP1

# allow reset only for current page and selected tracks
# this circumvents the fact that encoder
# processes inputs even if not selected
# this is also due to the limit of math operations at inputs
[logic]
    input1 = _GP1
    input2 = _SEL_1
    and    = _CLR_GP1_1

[logic]
    input1 = _GP1
    input2 = _SEL_2
    and    = _CLR_GP1_2

[logic]
    input1 = _GP1
    input2 = _SEL_3
    and    = _CLR_GP1_3

[logic]
    input1 = _GP1
    input2 = _SEL_4
    and    = _CLR_GP1_4
    
# activity
[encoder]
    select     = _GP1 * _SEL_1
    encoder    = E3.1
    color      = 0.15
    notch      = 0.1
    startvalue = 0.5
    clear      = B3.1 * _CLR_GP1_1 + _CLEAR_ALL
    output     = _ACT_G1

[encoder]
    select     = _GP1 * _SEL_2
    encoder    = E3.1
    color      = 0.15
    notch      = 0.1
    startvalue = 0.5
