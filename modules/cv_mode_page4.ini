# -------------------------------------------------
# cv mode page 4
# -------------------------------------------------
[logic]
    input1 = _CV_MDE
    input2 = _PAGE4
    and    = _CVP4

# allow reset only for current page and selected tracks
# this circumvents the fact that encoder
# processes inputs even if not selected
# this is also due to the limit of math operations at inputs
[logic]
    input1 = _CVP4
    input2 = _SEL_1
    and    = _SELCVP4_1

[logic]
    input1 = _CVP4
    input2 = _SEL_2
    and    = _SELCVP4_2

[logic]
    input1 = _CVP4
    input2 = _SEL_3
    and    = _SELCVP4_3

[logic]
    input1 = _CVP4
    input2 = _SEL_4
    and    = _SELCVP4_4

# rolls
[switch]
    input1 = _ROLL_CV1
    input2 = _ROLL_CV2
    input3 = _ROLL_CV3
    input4 = _ROLL_CV4
    offset = _SEL_OFST
    output = _ROLL_CVS

[switch]
    input1  = _ROLL_CVS
    input2  = 0
    offset  = _CLR_TRIG
    output  = _ROLL_CV_SET

[encoder]
    select     = _CVP4
    encoder    = E3.1
    color      = 0.5
    notch      = 0.1
    startvalue = _ROLL_CV_SET
    clear      = _SEL_CNG + _CLR_TRIG
    output     = _ROLL_CV

[sample]
    input  = _ROLL_CV
    gate   = _SELCVP4_1 * _SEL_GATE + _CLR_ALL
    output = _ROLL_CV1

[sample]
    input  = _ROLL_CV
    gate   = _SELCVP4_2 * _SEL_GATE + _CLR_ALL
    output = _ROLL_CV2

[sample]
    input  = _ROLL_CV
    gate   = _SELCVP4_3 * _SEL_GATE + _CLR_ALL
    output = _ROLL_CV3

[sample]
    input  = _ROLL_CV
    gate   = _SELCVP4_4 * _SEL_GATE + _CLR_ALL
    output = _ROLL_CV4

# rollcount
[switch]
    input1 = _ROC_CV1
    input2 = _ROC_CV2
    input3 = _ROC_CV3
    input4 = _ROC_CV4
    offset = _SEL_OFST
    output = _ROC_CVS

[switch]
    input1  = _ROC_CVS
    input2  = 0
    offset  = _CLR_TRIG
    output  = _ROC_CV_SET

[encoder]
    select       = _CVP4
    encoder      = E3.2
    color        = 0.7
    discrete     = 5
    outputoffset = 1
    notch        = 0.1
    startvalue   = _ROC_CV_SET
    clear        = _SEL_CNG + _CLR_TRIG
    output       = _ROC_CV

[sample]
    input  = _ROC_CV
    gate   = _SELCVP4_1 * _SEL_GATE + _CLR_ALL
    output = _ROC_CV1

[sample]
    input  = _ROC_CV
    gate   = _SELCVP4_2 * _SEL_GATE + _CLR_ALL
    output = _ROC_CV2

[sample]
    input  = _ROC_CV
    gate   = _SELCVP4_3 * _SEL_GATE + _CLR_ALL
    output = _ROC_CV3

[sample]
    input  = _ROC_CV
    gate   = _SELCVP4_4 * _SEL_GATE + _CLR_ALL
    output = _ROC_CV4

# rollsteps
[switch]
    input1 = _ROS_CV1
    input2 = _ROS_CV2
    input3 = _ROS_CV3
    input4 = _ROS_CV4
    offset = _SEL_OFST
    output = _ROS_CVS

[switch]
    input1  = _ROS_CVS
    input2  = 0
    offset  = _CLR_TRIG
    output  = _ROS_CV_SET

[encoder]
    select       = _CVP4
    encoder      = E3.3
    color        = 0.9
    discrete     = 5
    outputoffset = 1
    notch        = 0.1
    startvalue   = _ROS_CV_SET
    clear        = _SEL_CNG + _CLR_TRIG
    output       = _ROS_CV

[sample]
    input  = _ROS_CV
    gate   = _SELCVP4_1 * _SEL_GATE + _CLR_ALL
    output = _ROS_CV1

[sample]
    input  = _ROS_CV
    gate   = _SELCVP4_2 * _SEL_GATE + _CLR_ALL
    output = _ROS_CV2

[sample]
    input  = _ROS_CV
    gate   = _SELCVP4_3 * _SEL_GATE + _CLR_ALL
    output = _ROS_CV3

[sample]
    input  = _ROS_CV
    gate   = _SELCVP4_4 * _SEL_GATE + _CLR_ALL
    output = _ROS_CV4
    
