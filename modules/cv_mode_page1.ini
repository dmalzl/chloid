# -------------------------------------------------
# cv mode page 1
# -------------------------------------------------
[logic]
    input1 = _CV_MDE
    input2 = _PAGE1
    and    = _CVP1

# allow reset only for current page and selected tracks
# this circumvents the fact that encoder
# processes inputs even if not selected
# this is also due to the limit of math operations at inputs
[switch]
    input   = _CVP1
    output1 = _SELCVP1_1
    output2 = _SELCVP1_2
    output3 = _SELCVP1_3
    output4 = _SELCVP1_4
    offset  = _SEL_OFST * -1

# activity
[switch]
    input1 = _ACT_CV1
    input2 = _ACT_CV2
    input3 = _ACT_CV3
    input4 = _ACT_CV4
    offset = _SEL_OFST
    output = _ACT_CVS

[switch]
    input1  = _ACT_CVS
    input2  = 0.5
    offset  = _CLR_TRIG
    output  = _ACT_CV_SET
    
[encoder]
    select     = _CVP1
    encoder    = E3.1
    color      = 0.15
    notch      = 0.1
    startvalue = _ACT_CV_SET
    clear      = _SEL_CNG + _CLR_TRIG
    output     = _ACT_CV

[sample]
    input  = _ACT_CV
    gate   = _SELCVP1_1 * _SEL_GATE + _CLR_ALL
    output = _ACT_CV1

[sample]
    input  = _ACT_CV
    gate   = _SELCVP1_2 * _SEL_GATE + _CLR_ALL
    output = _ACT_CV2

[sample]
    input  = _ACT_CV
    gate   = _SELCVP1_3 * _SEL_GATE + _CLR_ALL
    output = _ACT_CV3

[sample]
    input  = _ACT_CV
    gate   = _SELCVP1_4 * _SEL_GATE + _CLR_ALL
    output = _ACT_CV4

# variation
[switch]
    input1 = _VAR_CV1
    input2 = _VAR_CV2
    input3 = _VAR_CV3
    input4 = _VAR_CV4
    offset = _SEL_OFST
    output = _VAR_CVS

[switch]
    input1  = _VAR_CVS
    input2  = 0
    offset  = _CLR_TRIG
    output  = _VAR_CV_SET

[encoder]
    select     = _CVP1
    encoder    = E3.2
    color      = 0.3
    startvalue = _VAR_CV_SET
    clear      = _SEL_CNG + _CLR_TRIG
    output     = _VAR_CV

[sample]
    input  = _VAR_CV
    gate   = _SELCVP1_1 * _SEL_GATE + _CLR_ALL
    output = _VAR_CV1

[sample]
    input  = _VAR_CV
    gate   = _SELCVP1_2 * _SEL_GATE + _CLR_ALL
    output = _VAR_CV2

[sample]
    input  = _VAR_CV
    gate   = _SELCVP1_3 * _SEL_GATE + _CLR_ALL
    output = _VAR_CV3

[sample]
    input  = _VAR_CV
    gate   = _SELCVP1_4 * _SEL_GATE + _CLR_ALL
    output = _VAR_CV4

