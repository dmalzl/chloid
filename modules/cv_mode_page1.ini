# -------------------------------------------------
# cv mode page 1
# -------------------------------------------------
[logic]
    input1 = _CV_MDE
    input2 = _PAGE1
    and    = _CVP1

# allow reset only for current page and selected tracks
# this circumvents the fact that encoder
# processes inputs even if not selected
# this is also due to the limit of math operations at inputs
[logic]
    input1 = _CVP1
    input2 = _SEL_1
    and    = _SELCVP1_1

[logic]
    input1 = _CVP1
    input2 = _SEL_2
    and    = _SELCVP1_2

[logic]
    input1 = _CVP1
    input2 = _SEL_3
    and    = _SELCVP1_3

[logic]
    input1 = _CVP1
    input2 = _SEL_4
    and    = _SELCVP1_4

# activity
[switch]
    input1 = _ACT_CV1
    input2 = _ACT_CV2
    input3 = _ACT_CV3
    input4 = _ACT_CV4
    offset = _SEL_OFST
    output = _ACT_CV_SET

[encoder]
    select     = _CVP1
    encoder    = E3.1
    color      = 0.15
#    startvalue = 0.5
    startvalue = _ACT_CV_SET
    clear      = _SEL_CNG
    output     = _ACT_CV

[sample]
    input  = _ACT_CV
    gate   = _SELCVP1_1 * _SEL_GATE
    output = _ACT_CV1

[sample]
    input  = _ACT_CV
    gate   = _SELCVP1_2 * _SEL_GATE
    output = _ACT_CV2

[sample]
    input  = _ACT_CV
    gate   = _SELCVP1_3 * _SEL_GATE
    output = _ACT_CV3

[sample]
    input  = _ACT_CV
    gate   = _SELCVP1_4 * _SEL_GATE
    output = _ACT_CV4

# variation
[switch]
    input1 = _VAR_CV1
    input2 = _VAR_CV2
    input3 = _VAR_CV3
    input4 = _VAR_CV4
    offset = _SEL_OFST
    output = _VAR_CV_SET

[encoder]
    select     = _CVP1
    encoder    = E3.2
    color      = 0.3
#    startvalue = 0
    startvalue = _VAR_CV_SET
    clear      = _SEL_CNG
    output     = _VAR_CV

[sample]
    input  = _VAR_CV
    gate   = _SELCVP1_1 * _SEL_GATE
    output = _VAR_CV1

[sample]
    input  = _VAR_CV
    gate   = _SELCVP1_2 * _SEL_GATE
    output = _VAR_CV2

[sample]
    input  = _VAR_CV
    gate   = _SELCVP1_3 * _SEL_GATE
    output = _VAR_CV3

[sample]
    input  = _VAR_CV
    gate   = _SELCVP1_4 * _SEL_GATE
    output = _VAR_CV4

# dejavu
[switch]
    input1 = _DEJ_CV1
    input2 = _DEJ_CV2
    input3 = _DEJ_CV3
    input4 = _DEJ_CV4
    offset = _SEL_OFST
    output = _DEJ_CV_SET

[encoder]
    select     = _CVP1
    encoder    = E3.3
    color      = 0.45
#    startvalue = 1
    startvalue = _DEJ_CV_SET
    clear      = _SEL_CNG
    output     = _DEJ_CV

[sample]
    input  = _DEJ_CV
    gate   = _SELCVP1_1 * _SEL_GATE
    output = _DEJ_CV1

[sample]
    input  = _DEJ_CV
    gate   = _SELCVP1_1 * _SEL_GATE
    output = _DEJ_CV2

[sample]
    input  = _DEJ_CV
    gate   = _SELCVP1_3 * _SEL_GATE
    output = _DEJ_CV3

[sample]
    input  = _DEJ_CV
    gate   = _SELCVP1_4 * _SEL_GATE
    output = _DEJ_CV4

# offbeat
[switch]
    input1 = _OFF_CV1
    input2 = _OFF_CV2
    input3 = _OFF_CV3
    input4 = _OFF_CV4
    offset = _SEL_OFST
    output = _OFF_CV_SET

[encoder]
    select     = _CVP1
    encoder    = E3.4
    color      = 0.6
#    startvalue = 0.5
    startvalue = _OFF_CV_SET
    clear      = _SEL_CNG
    output     = _OFF_CV

[sample]
    input  = _OFF_CV
    gate   = _SELCVP1_1 * _SEL_GATE
    output = _OFF_CV1

[sample]
    input  = _OFF_CV
    gate   = _SELCVP1_2 * _SEL_GATE
    output = _OFF_CV2

[sample]
    input  = _OFF_CV
    gate   = _SELCVP1_3 * _SEL_GATE
    output = _OFF_CV3

[sample]
    input  = _OFF_CV
    gate   = _SELCVP1_4 * _SEL_GATE
    output = _OFF_CV4
    
