    timing6 = _GRV_T6_G1
    timing7 = _GRV_T7_G1
    timing8 = _GRV_T8_G1
    output  = _CLKT_G1

# reset logic
[logic]
    input1 = _RESET_CURR_1 * _GATE_MDE + _RESET_BOTH_1
    input2 = _RESET_ALL
    or     = _RESET_G1

[logic]
    input1 = _RESET_CURR_1 * _CV_MDE + _RESET_BOTH_1
    input2 = _RESET_ALL
    or     = _RESET_CV1

