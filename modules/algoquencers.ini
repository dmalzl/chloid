# track 1
# clock manipulations
# division
[compare]
    input     = _DIV_G1
    compare   = 0
    ifgreater = _DIV_G1
    ifless    = 1
    ifequal   = 1
    output    = _MULT_G1

[compare]
    input     = _DIV_G1
