    ifless    = _DIV_G1 * -1
    ifgreater = 1
    ifequal   = 1
    output    = _DIVI_G1

[clocktool]
    clock    = _CLK
    divide   = _DIVI_G1
    multiply = _MULT_G1
    output   = _DIV_CLK_G1
    
# delay
[clocktool]
    clock  = _DIV_CLK_G1
    delay  = _DLY_G1
    output = _CLK_G1

# timing
[timing]
    clock   = _CLK_G1
    timing1 = _GRV_T1_G1
    timing2 = _GRV_T2_G1
    timing3 = _GRV_T3_G1
    timing4 = _GRV_T4_G1
