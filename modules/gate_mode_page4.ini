# -------------------------------------------------
# gates mode page 4
# -------------------------------------------------
[logic]
    input1 = _GATE_MDE
    input2 = _PAGE4
    and    = _GP4

# allow reset only for current page and selected tracks
# this circumvents the fact that encoder
# processes inputs even if not selected
# this is also due to the limit of math operations at inputs
[logic]
    input1 = _GP4
    input2 = _SEL_1
    and    = _SELGP4_1

[logic]
    input1 = _GP4
    input2 = _SEL_2
    and    = _SELGP4_2

[logic]
    input1 = _GP4
    input2 = _SEL_3
    and    = _SELGP4_3

[logic]
    input1 = _GP4
    input2 = _SEL_4
    and    = _SELGP4_4

# rolls
[switch]
    input1 = _NROLL_G1
    input2 = _NROLL_G2
    input3 = _NROLL_G3
    input4 = _NROLL_G4
    offset = _SEL_OFST
    output = _NROLL_G_SET

[encoder]
    select     = _GP4
    encoder    = E3.1
    color      = 0.5
#    startvalue = 0
    startvalue = _NROLL_G_SET
    clear      = _SEL_CNG
    output     = _NROLL_G

[sample]
    input  = _NROLL_G
    gate   = _SELGP4_1 * _SEL_GATE
    output = _NROLL_G1

[sample]
    input  = _NROLL_G
    gate   = _SELGP4_2 * _SEL_GATE
    output = _NROLL_G2

[sample]
    input  = _NROLL_G
    gate   = _SELGP4_3 * _SEL_GATE
    output = _NROLL_G3

[sample]
    input  = _NROLL_G
    gate   = _SELGP4_4 * _SEL_GATE
    output = _NROLL_G4

# rollcount
[switch]
    input1 = _ROC_G1
    input2 = _ROC_G2
    input3 = _ROC_G3
    input4 = _ROC_G4
    offset = _SEL_OFST
    output = _ROC_G_SET

[encoder]
    select       = _GP4
    encoder      = E3.2
    color        = 0.7
    discrete     = 5
    outputoffset = 1
#    startvalue   = 0
    startvalue   = _ROC_G_SET
    clear        = _SEL_CNG
    output       = _ROC_G

[sample]
    input  = _ROC_G
    gate   = _SELGP4_1 * _SEL_GATE
    output = _ROC_G1

[sample]
    input  = _ROC_G
    gate   = _SELGP4_2 * _SEL_GATE
    output = _ROC_G2

[sample]
    input  = _ROC_G
    gate   = _SELGP4_3 * _SEL_GATE
    output = _ROC_G3

[sample]
    input  = _ROC_G
    gate   = _SELGP4_4 * _SEL_GATE
    output = _ROC_G4

# rollsteps
[switch]
    input1 = _ROS_G1
    input2 = _ROS_G2
    input3 = _ROS_G3
    input4 = _ROS_G4
    offset = _SEL_OFST
    output = _ROS_G_SET

[encoder]
    select       = _GP4
    encoder      = E3.3
    color        = 0.9
    discrete     = 5
    outputoffset = 1
#    startvalue   = 0
    startvalue   = _ROS_G_SET
    clear        = _SEL_CNG
    output       = _ROS_G

[sample]
    input  = _ROS_G
    gate   = _SELGP4_1 * _SEL_GATE
    output = _ROS_G1

[sample]
    input  = _ROS_G
    gate   = _SELGP4_2 * _SEL_GATE
    output = _ROS_G2

[sample]
    input  = _ROS_G
    gate   = _SELGP4_3 * _SEL_GATE
    output = _ROS_G3

[sample]
    input  = _ROS_G
    gate   = _SELGP4_4 * _SEL_GATE
    output = _ROS_G4
    
