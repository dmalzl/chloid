# -------------------------------------------------
# gates mode page 1
# -------------------------------------------------
[logic]
    input1 = _GATE_MDE
    input2 = _PAGE1
    and    = _GP1

# allow reset only for current page and selected tracks
# this circumvents the fact that encoder
# processes inputs even if not selected
# this is also due to the limit of math operations at inputs
[logic]
    input1 = _GP1
    input2 = _SEL_1
    and    = _SELGP1_1

[logic]
    input1 = _GP1
    input2 = _SEL_2
    and    = _SELGP1_2

[logic]
    input1 = _GP1
    input2 = _SEL_3
    and    = _SELGP1_3

[logic]
    input1 = _GP1
    input2 = _SEL_4
    and    = _SELGP1_4
    
# activity
[switch]
    input1 = _NACT_G1
    input2 = _NACT_G2
    input3 = _NACT_G3
    input4 = _NACT_G4
    offset = _SEL_OFST
    output = _NACT_G_SET

[encoder]
    select     = _GP1
    encoder    = E3.1
    color      = 0.15
#    startvalue = 0.5
    startvalue = _NACT_G_SET
    clear      = _SEL_CNG
    output     = _NACT_G

[sample]
    input  = _NACT_G
    gate   = _SELGP1_1 * _SEL_GATE
    output = _NACT_G1

[sample]
    input  = _NACT_G
    gate   = _SELGP1_2 * _SEL_GATE
    output = _NACT_G2

[sample]
    input  = _NACT_G
    gate   = _SELGP1_3 * _SEL_GATE
    output = _NACT_G3

[sample]
    input  = _NACT_G
    gate   = _SELGP1_4 * _SEL_GATE
    output = _NACT_G4

# variation
[switch]
    input1 = _NVAR_G1
    input2 = _NVAR_G2
    input3 = _NVAR_G3
    input4 = _NVAR_G4
    offset = _SEL_OFST
    output = _NVAR_G_SET

[encoder]
    select     = _GP1
    encoder    = E3.2
    color      = 0.3
#    startvalue = 0
    startvalue = _NVAR_G_SET
    clear      = _SEL_CNG
    output     = _NVAR_G

[sample]
    input  = _NVAR_G
    gate   = _SELGP1_1 * _SEL_GATE
    output = _NVAR_G1

[sample]
    input  = _NVAR_G
    gate   = _SELGP1_2 * _SEL_GATE
    output = _NVAR_G2

[sample]
    input  = _NVAR_G
    gate   = _SELGP1_3 * _SEL_GATE
    output = _NVAR_G3

[sample]
    input  = _NVAR_G
    gate   = _SELGP1_4 * _SEL_GATE
    output = _NVAR_G4

# dejavu
[switch]
    input1 = _DEJ_G1
    input2 = _DEJ_G2
    input3 = _DEJ_G3
    input4 = _DEJ_G4
    offset = _SEL_OFST
    output = _DEJ_G_SET

[encoder]
    select     = _GP1
    encoder    = E3.3
    color      = 0.45
#    startvalue = 1
    startvalue = _DEJ_G_SET
    clear      = _SEL_CNG
    output     = _DEJ_G

[sample]
    input  = _DEJ_G
    gate   = _SELGP1_1 * _SEL_GATE
    output = _DEJ_G1

[sample]
    input  = _DEJ_G
    gate   = _DEJ_2 * _SEL_GATE
    output = _DEJ_G2

[sample]
    input  = _DEJ_G
    gate   = _SELGP1_3 * _SEL_GATE
    output = _DEJ_G3

[sample]
    input  = _DEJ_G
    gate   = _SELGP1_4 * _SEL_GATE
    output = _DEJ_G4

# offbeat
[switch]
    input1 = _OFF_G1
    input2 = _OFF_G2
    input3 = _OFF_G3
    input4 = _OFF_G4
    offset = _SEL_OFST
    output = _OFF_G_SET

[encoder]
    select     = _GP1
    encoder    = E3.4
    color      = 0.6
#    startvalue = 0.5
    startvalue = _OFF_G_SET
    clear      = _SEL_CNG
    output     = _OFF_G

[sample]
    input  = _OFF_G
    gate   = _SELGP1_1 * _SEL_GATE
    output = _OFF_G1

[sample]
    input  = _OFF_G
    gate   = _SELGP1_2 * _SEL_GATE
    output = _OFF_G2

[sample]
    input  = _OFF_G
    gate   = _SELGP1_3 * _SEL_GATE
    output = _OFF_G3

[sample]
    input  = _OFF_G
    gate   = _SELGP1_4 * _SEL_GATE
    output = _OFF_G4
    
