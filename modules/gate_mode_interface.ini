# gates mode
# page 1
[logic]
    input1 = _GATE_MDE
    input2 = _PAGE1
    and    = _GP1

# allow reset only for current page and selected tracks
# this circumvents the fact that encoder
# processes inputs even if not selected
# this is also due to the limit of math operations at inputs
[logic]
    input1 = _GP1
    input2 = _SEL_1
    and    = _SELGP1_1

[logic]
    input1 = _GP1
    input2 = _SEL_2
    and    = _SELGP1_2

[logic]
    input1 = _GP1
    input2 = _SEL_3
    and    = _SELGP1_3

[logic]
    input1 = _GP1
    input2 = _SEL_4
    and    = _SELGP1_4
    
# activity
[switch]
    input1 = _NACT_G1
    input2 = _NACT_G2
    input3 = _NACT_G3
    input4 = _NACT_G4
    offset = _SEL_OFST
    output = _NACT_G_SET

[encoder]
