    color        = _ENC_COL_CV * _SEL_OFST + 1
#    startvalue   = 0
    mode         = 2
    notch        = 0.1
    startvalue   = _GRVCV_15_SET
    clear        = _SEL_CNG + _CLR_TRIG
    output       = _GRVCV_15

# track 1
[sample]
