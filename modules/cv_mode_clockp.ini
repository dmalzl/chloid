# -------------------------------------------------
# cv mode page clock controls
# -------------------------------------------------
[logic]
    input1 = _CV_MDE
    input2 = _CLK_SET
    and    = _CLKCV

# allow reset only for current page and selected tracks
# this circumvents the fact that encoder
# processes inputs even if not selected
# this is also due to the limit of math operations at inputs
[switch]
    input   = _CLKCV
    output1 = _SELCLKCV_1
    output2 = _SELCLKCV_2
    output3 = _SELCLKCV_3
    output4 = _SELCLKCV_4
    offset  = _SEL_OFST * -1 # necessary to adhere to reverse indexing order at multiple outputs

# clock delay
[switch]
    input1 = _DLY_CV1
    input2 = _DLY_CV2
    input3 = _DLY_CV3
    input4 = _DLY_CV4
    offset = _SEL_OFST
    output = _DLY_CVS

[switch]
    input1  = _DLY_CVS
    input2  = 0
    offset  = _CLR_TRIG
    output  = _DLY_CV_SET

[encoder]
    select       = _CLKCV
    encoder      = E3.1
    color        = 0.2
    notch        = 0.1
    mode         = 2
    startvalue   = _DLY_CV_SET
    clear        = _SEL_CNG + _CLR_TRIG
    output       = _DLY_CV

[sample]
    input  = _DLY_CV
    gate   = _SELCLKCV_1 * _SEL_GATE + _CLR_ALL
    output = _DLY_CV1

[sample]
    input  = _DLY_CV
    gate   = _SELCLKCV_2 * _SEL_GATE + _CLR_ALL
    output = _DLY_CV2

[sample]
    input  = _DLY_CV
    gate   = _SELCLKCV_3 * _SEL_GATE + _CLR_ALL
    output = _DLY_CV3

[sample]
    input  = _DLY_CV
    gate   = _SELCLKCV_4 * _SEL_GATE + _CLR_ALL
    output = _DLY_CV4

# clock division
[switch]
    input1 = _DIV_CV1R
    input2 = _DIV_CV2R
    input3 = _DIV_CV3R
    input4 = _DIV_CV4R
    offset = _SEL_OFST
    output = _DIV_CVS

[switch]
    input1  = _DIV_CVS
    input2  = 7
    offset  = _CLR_TRIG
    output  = _DIV_CV_SET

[encoder]
    select       = _CLKCV
    encoder      = E3.2
    color        = 1
    # with these setting encoder goes from -7 to +7 resting at 0
    discrete     = 15
    notch        = 0.1
    startvalue   = _DIV_CV_SET
    clear        = _SEL_CNG + _CLR_TRIG
    output       = _DIV_CV

[sample]
    input  = _DIV_CV
    gate   = _SELCLKCV_1 * _SEL_GATE + _CLR_ALL
    output = _DIV_CV1R

# see gate_mode_clockp.ini for why we do it like this
[copy]
    input  = _DIV_CV1R - 7
    output = _DIV_CV1

[sample]
    input  = _DIV_CV
    gate   = _SELCLKCV_2 * _SEL_GATE + _CLR_ALL
    output = _DIV_CV2R

[copy]
    input  = _DIV_CV2R - 7
    output = _DIV_CV2

[sample]
    input  = _DIV_CV
    gate   = _SELCLKCV_3 * _SEL_GATE + _CLR_ALL
    output = _DIV_CV3R

[copy]
    input  = _DIV_CV3R - 7
    output = _DIV_CV3

[sample]
    input  = _DIV_CV
    gate   = _SELCLKCV_4 * _SEL_GATE + _CLR_ALL
    output = _DIV_CV4R

[copy]
    input  = _DIV_CV4R - 7
    output = _DIV_CV4

# groove or timing menu
[logic]
    input1 = _CV_MDE * _GRV_SET
    input2 = _ENC_SEL_SHT
    and    = _GRVCVP1

[logic]
    input1 = _CV_MDE * _GRV_SET
    input2 = _ENC_SEL_LNG
    and    = _GRVCVP2

[switch]
    input   = _GRVCVP1
    output1 = _SELGRVCVP1_1
    output2 = _SELGRVCVP1_2
    output3 = _SELGRVCVP1_3
    output4 = _SELGRVCVP1_4
    offset  = _SEL_OFST * -1

[switch]
    input   = _GRVCVP2
    output1 = _SELGRVCVP2_1
    output2 = _SELGRVCVP2_2
    output3 = _SELGRVCVP2_3
    output4 = _SELGRVCVP2_4
    offset  = _SEL_OFST * -1
    
[case]
    case1  = _GRVCVP1
    value1 = 0.1
    case2  = _GRVCVP2
    value2 = 0.3
    output = _ENC_COL_CV

# groove timing 1 and 5
[switch]
    input1 = _GRV_T1_CV1
    input2 = _GRV_T1_CV2
    input3 = _GRV_T1_CV3
    input4 = _GRV_T1_CV4
