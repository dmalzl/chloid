    and    = _CLR_CVP1_3

[logic]
    input1 = _CVP1
    input2 = _SEL_4
    and    = _CLR_CVP1_4
    
# activity
[encoder]
    select     = _CVP1 * _SEL_1
    encoder    = E3.1
    color      = 0.15
    notch      = 0.1
    startvalue = 0.5
    clear      = B3.1 * _CLR_CVP1_1 + _CLEAR_ALL
    output     = _ACT_CV1

