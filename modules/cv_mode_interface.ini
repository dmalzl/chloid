# cv mode
# page 1
[logic]
    input1 = _CV_MDE
    input2 = _PAGE1
    and    = _CVP1

# allow reset only for current page and selected tracks
# this circumvents the fact that encoder
# processes inputs even if not selected
# this is also due to the limit of math operations at inputs
[logic]
    input1 = _CVP1
    input2 = _SEL_1
    and    = _SELCVP1_1

[logic]
    input1 = _CVP1
    input2 = _SEL_2
    and    = _SELCVP1_2

[logic]
    input1 = _CVP1
    input2 = _SEL_3
    and    = _SELCVP1_3

[logic]
    input1 = _CVP1
    input2 = _SEL_4
    and    = _SELCVP1_4

# activity
[switch]
    input1 = _NACT_CV1
    input2 = _NACT_CV2
    input3 = _NACT_CV3
    input4 = _NACT_CV4
    offset = _SEL_OFST
    output = _NACT_CV_SET

[encoder]
    select     = _CVP1
    encoder    = E3.1
    color      = 0.15
#    startvalue = 0.5
    startvalue = _NACT_CV_SET
    clear      = _SEL_CNG
