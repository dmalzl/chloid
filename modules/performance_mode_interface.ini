    encoder    = E3.4
    color      = 0.15
    notch      = 0.1
    startvalue = _NACT_G4
    clear      = B3.4 * _CLR_PACTG + _CLR_ON_PERF
    output     = _PACT_G4

# activity encoders for CV algos
