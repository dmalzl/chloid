# performance mode selectors
[buttongroup]
    select    = _PERF_MDE
    minactive = 1
    maxactive = 1
    button1   = B2.17
    button2   = B2.18
    button3   = B2.19
    button4   = B2.20
    led1      = _PACT
    led2      = _PVAR
    led3      = _PFILL
    led4      = _PROLL
    longpress = _PMDE_SEL_LNG

[logic]
    input   = _PMDE_SEL_LNG
    negated = _PMDE_SEL_SHT

[copy]
    input  = _PACT * _PERF_MDE
    output = L2.17

[copy]
    input  = _PACT * _PERF_MDE
    output = L2.18

[copy]
    input  = _PACT * _PERF_MDE
    output = L2.19

[copy]
    input  = _PACT * _PERF_MDE
    output = L2.20

# clear on entering performance mode
# resets all the encoders to the current value of the individual algos
[logic]
    input1 = _MDE_SEL_CHANGE
    input2 = _PERF_MDE
    and    = _CLR_ON_PERF
    
# activity
[logic]
    input1 = _PMDE_SEL_SHT
    input2 = _PERF_MDE
    input2 = _PACT
    and    = _PACTG

[logic]
    input1 = _PMDE_SEL_LNG
    input2 = _PERF_MDE
    input2 = _PACT
    and    = _PACTCV
    
[logic]
    input1 = _PERF_MDE
    input2 = _PACTG
    and    = _CLR_PACTG
    
[logic]
    input1 = _PERF_MDE
    input2 = _PACTCV
    and    = _CLR_PACTCV

# activity encoders for gate algos
[encoder]
    select     = _SEL_1 * _PACTG
    encoder    = E3.1
    color      = 0.15
    notch      = 0.1
    startvalue = _NACT_G1
    clear      = B3.1 * _CLR_PACTG + _CLR_ON_PERF
    output     = _PACT_G1

[encoder]
    select     = _SEL_2 * _PACTG
    encoder    = E3.2
    color      = 0.15
    notch      = 0.1
    startvalue = _NACT_G2
    clear      = B3.2 * _CLR_PACTG + _CLR_ON_PERF
