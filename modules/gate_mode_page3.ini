# -------------------------------------------------
# gates mode page 3
# -------------------------------------------------
[logic]
    input1 = _GATE_MDE
    input2 = _PAGE3
    input3 = _ENC_SEL_SHT
    input4 = _NRM_MDE
    and    = _GP3

[logic]
    input1 = _GATE_MDE
    input2 = _PAGE3
    input3 = _ENC_SEL_LNG
    input4 = _NRM_MDE
    and    = _GP3L

# [encoder]
#     select   = _GP3L
#     encoder  = E3.2
#     led      = 0
#     override = 1

# [encoder]
#     select   = _GP3L
#     encoder  = E3.3
#     led      = 0
#     override = 1

[logic]
    input1 = _GP3
    input2 = _ALT_MDE
    and    = _GP3A

# [encoder]
#     select   = _GP3A
#     encoder  = E3.1
#     led      = 0
#     override = 1

# [encoder]
#     select   = _GP3A
#     encoder  = E3.3
#     led      = 0
#     override = 1

# [encoder]
#     select   = _GP3A
#     encoder  = E3.4
#     led      = 0
#     override = 1

# allow reset only for current page and selected tracks
# this circumvents the fact that encoder
# processes inputs even if not selected
# this is also due to the limit of math operations at inputs
[logic]
    input1 = _GP3
    input2 = _SEL_1
    and    = _SELGP3_1

[logic]
    input1 = _GP3
    input2 = _SEL_2
    and    = _SELGP3_2

[logic]
    input1 = _GP3
    input2 = _SEL_3
    and    = _SELGP3_3

[logic]
    input1 = _GP3
    input2 = _SEL_4
    and    = _SELGP3_4

[logic]
    input1 = _GP3L
    input2 = _SEL_1
    and    = _SELGP3L_1

[logic]
    input1 = _GP3L
    input2 = _SEL_2
    and    = _SELGP3L_2

[logic]
    input1 = _GP3L
    input2 = _SEL_3
    and    = _SELGP3L_3

[logic]
    input1 = _GP3L
    input2 = _SEL_4
    and    = _SELGP3L_4

[logic]
    input1 = _GP3A
    input2 = _SEL_1
    and    = _SELGP3A_1

[logic]
    input1 = _GP3A
    input2 = _SEL_2
    and    = _SELGP3A_2

[logic]
    input1 = _GP3A
    input2 = _SEL_3
    and    = _SELGP3A_3

[logic]
    input1 = _GP3A
    input2 = _SEL_4
    and    = _SELGP3A_4

# fills
[switch]
    input1 = _NFILL_G1
    input2 = _NFILL_G2
    input3 = _NFILL_G3
    input4 = _NFILL_G4
    offset = _SEL_OFST
    output = _NFILL_G_SET

[encoder]
    select     = _GP3
    encoder    = E3.1
    color      = 1.1
#    startvalue = 0
    startvalue = _NFILL_G_SET
    clear      = _SEL_CNG
    output     = _NFILL_G

[sample]
    input  = _NFILL_G
    gate   = _SELGP3_1 * _SEL_GATE
    output = _NFILL_G1

[sample]
    input  = _NFILL_G
    gate   = _SELGP3_2 * _SEL_GATE
    output = _NFILL_G2

[sample]
    input  = _NFILL_G
    gate   = _SELGP3_3 * _SEL_GATE
    output = _NFILL_G3

[sample]
    input  = _NFILL_G
    gate   = _SELGP3_4 * _SEL_GATE
    output = _NFILL_G4
    
# fill order
[switch]
    input1 = _FILLO_G1
    input2 = _FILLO_G2
    input3 = _FILLO_G3
    input4 = _FILLO_G4
    offset = _SEL_OFST
    output = _FILLO_G_SET

[encoder]
    select     = _GP3L
    encoder    = E3.1
    color      = 1.3
    discrete   = 4
#    startvalue = 0
    startvalue = _FILLO_G_SET
