# -------------------------------------------------
# gates mode page 3
# -------------------------------------------------
[logic]
    input1 = _GATE_MDE
    input2 = _PAGE3
    input3 = _ENC_SEL_SHT
    input4 = _NRM_MDE
    and    = _GP3

[logic]
    input1 = _GATE_MDE
    input2 = _PAGE3
    input3 = _ENC_SEL_LNG
    input4 = _NRM_MDE
    and    = _GP3L

[logic]
    input1 = _GATE_MDE
    input2 = _PAGE3
    input3 = _ENC_SEL_SHT
    input4 = _ALT_MDE
    and    = _GP3A

# allow reset only for current page and selected tracks
# this circumvents the fact that encoder
# processes inputs even if not selected
# this is also due to the limit of math operations at inputs
[switch]
    input   = _GP3
    output1 = _SELGP3_1
    output2 = _SELGP3_2
    output3 = _SELGP3_3
    output4 = _SELGP3_4
    offset  = _SEL_OFST

[switch]
    input   = _GP3L
    output1 = _SELGP3L_1
    output2 = _SELGP3L_2
    output3 = _SELGP3L_3
    output4 = _SELGP3L_4
    offset  = _SEL_OFST

[switch]
    input   = _GP3A
    output1 = _SELGP3A_1
    output2 = _SELGP3A_2
    output3 = _SELGP3A_3
    output4 = _SELGP3A_4
    offset  = _SEL_OFST
    
# fills
[switch]
    input1 = _FILL_G1
    input2 = _FILL_G2
    input3 = _FILL_G3
    input4 = _FILL_G4
    offset = _SEL_OFST
    output = _FILL_GS

[switch]
    input1  = _FILL_GS
    input2  = 0
    offset  = _CLR_TRIG
    output  = _FILL_G_SET

[encoder]
    select     = _GP3
    encoder    = E3.1
    color      = 1.1
    startvalue = _FILL_G_SET
    clear      = _SEL_CNG + _CLR_TRIG
    output     = _FILL_G

[sample]
    input  = _FILL_G
    gate   = _SELGP3_1 * _SEL_GATE + _CLR_ALL
    output = _FILL_G1

[sample]
    input  = _FILL_G
    gate   = _SELGP3_2 * _SEL_GATE + _CLR_ALL
    output = _FILL_G2

[sample]
    input  = _FILL_G
    gate   = _SELGP3_3 * _SEL_GATE + _CLR_ALL
    output = _FILL_G3

[sample]
    input  = _FILL_G
    gate   = _SELGP3_4 * _SEL_GATE + _CLR_ALL
    output = _FILL_G4
    
# fill order
[switch]
    input1 = _FILLO_G1
    input2 = _FILLO_G2
    input3 = _FILLO_G3
    input4 = _FILLO_G4
