    output2 = _SELGRVGP2_2
    output3 = _SELGRVGP2_3
    output4 = _SELGRVGP2_4
    offset  = _SEL_OFST
    
[case]
    case1  = _GRVGP1
    value1 = 0.1
    case2  = _GRVGP2
    value2 = 0.3
    output = _ENC_COL_G

