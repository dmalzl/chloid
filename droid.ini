    timing8 = _GRV_T8_CV4
    output  = _CLKT_CV4

# reset logic   
[logic]
    input1 = _RST_4 * _CV_MDE + _RST_BOTH
    input2 = _RST_ALL
    or     = _RST_CV4
    
# performance mode switches
[switch]
