# -------------------------------------------------
# unused encoders logic
# -------------------------------------------------
# Define the inverse of Tracks 1 & 2 for the Envelope empty state
[logic]
    input   = _SEL_12
    negated = _NSEL_12

[logic]
    input1 = _GATE_MDE
    input2 = _ENV_SLEWQ_P
    input3 = _NSEL_12
    and    = _ENV_G_EMPTY

# Catch Page 3 Long-Press + ALT Mode empty state
[logic]
    input1 = _PAGE3
    input2 = _ENC_SEL_LNG
    input3 = _ALT_MDE
    and    = _P3_LNG_ALT

# Group the 3 hidden empty states into one variable
[logic]
    input1 = _LEN_SET
    input2 = _ENV_G_EMPTY
    input3 = _P3_LNG_ALT
    or     = _GLOBAL_EMPTY

# ----------------- E3.1 OFF -----------------
[logic]
    input1 = _GP3A
    input2 = _CVP3A
    input3 = _GLOBAL_EMPTY
    or     = _E3_1_UNUSED

[encoder]
    select   = _E3_1_UNUSED
    encoder  = E3.1
    mode     = 0

# ----------------- E3.2 OFF -----------------
[logic]
    input1 = _GP3L
    input2 = _CVP3L
    input3 = _ENVPS
    input4 = _GLOBAL_EMPTY
    or     = _E3_2_UNUSED

[encoder]
    select   = _E3_2_UNUSED
    encoder  = E3.2
    mode     = 0

# ----------------- E3.3 OFF -----------------
[logic]
    input1 = _GP2
