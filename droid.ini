# controller initialization in order of appearance in rack
[p2b8]
[b32]
[e4]

# setup clock and usage
# this is the internal clock set by P1.1
[pot]
    input    = P1.1
    notch    = 0.1
    output   = _RATE
    ledgauge = on # set this to of to disable use of B32 leds as value gauge

# only allow 60 values per volt, to match the precision of bpm (1HZ is 60BPM)
[quantizer]
    input = _RATE
    steps = 60
    output = _RATE_QUAN

# 0 BPM to 240BPM at 16th notes. multiply by 10 to make into hz, then by 4 for 16th notes granularity.
[lfo]
    hz = _RATE_QUAN * 40 
    square = _INT_CLK_RAW

[midiin]
    trs     = 1
    usb     = 1
    clock   = _MIDI_CLOCK
    running = _MIDI_RUN
    
