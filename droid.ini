    encoder  = E3.3
    mode     = 0

# ----------------- E3.4 OFF -----------------
# Since E3.4 has 10 unused states, we cascade two logic blocks to bypass the 8-input limit
[logic]
    input1 = _GP2
    input2 = _GP3A
    input3 = _GP4
    input4 = _ENVPS
    input5 = _CLKG
    input6 = _CVP3A
    input7 = _CVP4
