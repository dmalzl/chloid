# algoquencer controls #
########################
# reset the currently selected track to step 1
# or all tracks by longpress
[buttongroup]
    button1 = B1.3
    button2 = B1.5
    button3 = B1.7
    led1    = _RESET_MDE
    led2    = _TRK_SEL
    led3    = _MUTE_MDE
    maxactive = 1
    minactive = 1
    longpress = _LNG_PRS_ACT # currently only supports _RESET_ALL

# ensures only reset uses longpress
[logic]
    input1 = _RESET_MDE
    input2 = _LNG_PRS_ACT
    and    = _RESET_ALL

[logic]
    input   = _RESET_MDE
    negated = _NOT_RESET_MDE

# forwarding state to LEDs
# this is done for better readability
[copy]
    input  = _RESET_MDE
    output = L1.3
    
[copy]
    input  = _TRK_SEL
    output = L1.5

[copy]
    input  = _MUTE_MDE
    output = L1.7

[buttongroup]
