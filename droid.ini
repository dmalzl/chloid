# cv algo
# clock manipulations
# division
[compare]
    input     = _DIV_CV4
    compare   = 0
    ifgreater = _DIV_CV4
    ifless    = 1
    ifequal   = 1
    output    = _MULT_CV4

[compare]
    input     = _DIV_CV4
    compare   = 0
    ifless    = _DIV_CV4 * -1
    ifgreater = 1
    ifequal   = 1
    output    = _DIVI_CV4

[clocktool]
    clock    = _CLK
    divide   = _DIVI_CV4
    multiply = _MULT_CV4
    output   = _DIV_CLK_CV4

# delay
[clocktool]
    clock  = _DIV_CLK_CV4
    delay  = _DLY_CV4
    output = _CLK_CV4

# timing
[timing]
    clock   = _CLK_CV4
    timing1 = _GRV_T1_CV4
    timing2 = _GRV_T2_CV4
    timing3 = _GRV_T3_CV4
    timing4 = _GRV_T4_CV4
