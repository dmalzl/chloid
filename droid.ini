# LABELS: master=18
[p2b8]
[b32]
[e4]

#########
# clock #
#########
# setup clock and usage for 15 - 330 bpm (Pamela's PRO workout range + convenience for calculation)
# this is the internal clock set by P1.1
[pot]
    pot         = P1.1
    output      = _RATE
    ledgauge    = off

# we want 1 bpm per step so we need 330 - 15 = 315 steps
[quantizer]
    input  = _RATE
    steps  = 315
    output = _RATE_Q

# here we want 15 to 330 BPM at 16th note resolution
# convert bpm to Hz by dividing by 15 (this is divide by 60 to go from bpm to bps and then multiply by 4 to get 4PPQ)
# -> 330 BPM = 22Hz; 15 BPM = 1Hz so we need to go from 1 to 22Hz
# this means we need to scale _CLK_RATE by a factor of 21Hz / 1V = 21
[lfo]
    hz     = _RATE_Q * 21 + 1
    square = _INT_CLK

# 24PPQ clok
[lfo]
   hz      = _RATE_Q * 126 + 1  # this needs to be changed accordingly if BPM range is changed
   square  = _INT_CLK_24

########
# MIDI #
########
[midiin]
    trs        = 1
    usb        = 1
    clock      = _MIDI_CLK    # this is 4PPQ per definition
    midiclock  = _MIDI_CLK_24

# forward any received midi info to trs1
[midithrough]
    fromusb = 1
    fromtrs = 1
    totrs   = 1

[midiout]
    trs   = 2
    usb   = 1
    clock = _INT_CLK

#################
# running setup #
#################
# use pot 2 of p2b8 for switching between midi and internal clock
# using discrete = 2 to limit values to integers 0 and 1
[pot]
    pot      = P1.2
    discrete = 2
    output   = _CLK_SEL
    ledgauge = off

# either select internal or external clock
[switch]
    input1  = _INT_CLK
    input2  = _MIDI_CLK
    offset  = _CLK_SEL
    output1 = _MASTER_CLK

# use button 1 on p2b8 as play/pause incl. bpm indicator by flashing led
# longpress to reset sequencers
[button]
    button     = B1.1
    led        = L1.1
    onvalue    = _MASTER_CLK
    offvalue   = 0
    output     = _CLK
    longpress  = _RESET
    
# output selected clock
[switch]
    input1 = _INT_CLK_24
    input2 = _MIDI_CLK_24
    offset = _CLK_SEL
    output = _OUT_CLK

[copy]
    input  = _OUT_CLK
    output = O8

#####################
# algoquencer setup #
#####################
# select mutes when on else usual track select
[button]
    button  = B1.3
    led     = L1.3
    output  = _MUTE_SEL
    negated = _TRACK_SEL

    
# select between the four available algoquencers
# second column of p2b8
[buttongroup]
    select    = _TRACK_SEL
    minactive = 0
    button1   = B2.29
    button2   = B2.30
