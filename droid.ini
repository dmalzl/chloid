# mode selectors
# -------------------------------------------------
# global clear
# this is to reset the full sequencer to default i.e. all the values
# as DROID tends to save the last settings so you can start fresh
# reset all button
[logic]
    input   = _CLK_SEL_MDE
    negated = _NCLK_SEL_MDE
    
[button]
    select        = _NCLK_SEL_MDE
    button        = B1.2
    longpresstime = 2
    longpress     = _RST_ALL

[button]
    button        = B1.3
    longpresstime = 2
    longpress     = _CLR_ALL # this is to avoid accidental clearing

[button]
    button        = B1.4
    longpress     = _RR_ALL
    longpresstime = 2
    
